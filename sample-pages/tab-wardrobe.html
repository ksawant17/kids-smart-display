<!DOCTYPE html>
<html lang="en">
<!-- Use the identical <head> styling from the Quote tab, but change the active nav logic in CSS -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Dashboard - Wardrobe Tab</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-cyan: #4bd8f6; --card-white: #ffffff; --border-dark: #111827; --text-dark: #111827; --yellow-banner: #ffde3a; --bg-light-blue: #f0f9ff; --tab-orange: #ffab3b; --tab-red: #ff6b6b; --tab-green: #5ad570; --tab-purple: #b388ff; --tab-pink: #e06ced; --sticker-shadow: 4px 4px 0px rgba(0, 0, 0, 0.12); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif; color: var(--text-dark); }
        body { background-color: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #pi-screen { width: 800px; height: 480px; background-color: var(--bg-cyan); border: 5px solid var(--border-dark); display: flex; flex-direction: column; padding: 14px 16px 0 16px; gap: 14px; overflow: hidden; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        header { display: flex; justify-content: space-between; align-items: center; height: 38px; }
        .header-left { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; }
        .header-sun { width: 32px; height: 32px; margin: 0 10px; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.15)); }
        .header-right { font-size: 22px; font-weight: 900; background-color: var(--card-white); padding: 4px 16px; border: 3px solid var(--border-dark); border-radius: 20px; box-shadow: 3px 3px 0 var(--border-dark); }
        .card { background-color: var(--card-white); border: 3px solid var(--border-dark); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; box-shadow: var(--sticker-shadow); position: relative; min-height: 0; }
        .section-title { font-size: 16px; font-weight: 900; text-align: center; background: var(--yellow-banner); border: 2.5px solid var(--border-dark); border-radius: 20px; padding: 4px 16px; display: inline-block; margin: 0 auto 12px auto; white-space: nowrap; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        
        /* Interactive Checklist Items */
        .clothes-item { display: flex; align-items: center; background: var(--card-white); border: 3px solid var(--border-dark); border-radius: 12px; padding: 8px 16px; font-size: 20px; font-weight: 900; gap: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.1s; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .clothes-item:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
        .clothes-item img { width: 36px; height: 36px; }

        nav { display: flex; gap: 8px; height: 80px; margin-top: auto; }
        .tab { flex: 1; border: 3.5px solid var(--border-dark); border-bottom: none; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding-top: 4px; transition: opacity 0.2s ease, transform 0.2s ease; opacity: 0.5; transform: translateY(6px); }
        .tab.active { opacity: 1; transform: translateY(0); }
        .tab span { color: #ffffff; font-weight: 900; font-size: 15px; letter-spacing: 0.5px; margin-top: 2px; }
        .tab img { width: 30px; height: 30px; object-fit: contain; }
        .tab-today { background-color: #94a3b8; } .tab-calendar { background-color: #94a3b8; } .tab-quote { background-color: #94a3b8; } .tab-wardrobe { background-color: var(--tab-purple); } .tab-fun { background-color: #94a3b8; }
    </style>
</head>
<body>
    <div id="pi-screen">
        <header>
            <div class="header-left">Good Morning, Alex & Sam! <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f31e.svg" class="header-sun" alt="sun"> Wed, Oct 7</div>
            <div class="header-right">8:30 AM</div>
        </header>

        <!-- Wardrobe Main Area -->
        <main style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; flex: 1; min-height: 0;">
            <!-- Today's Condition Reference -->
            <div class="card" style="align-items: center; justify-content: center; background-color: var(--bg-light-blue);">
                <div class="section-title">Today's Weather</div>
                <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/26c5.svg" style="width: 100px; height: 100px; filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.15));">
                <div style="font-size: 65px; font-weight: 900; line-height: 1; margin: 10px 0;">68&deg;</div>
                <div style="font-size: 20px; font-weight: 900;">Partly Sunny</div>
            </div>

            <!-- Outfit Checklist -->
            <div class="card" style="background-color: #f3e8ff;">
                <div class="section-title" style="background: var(--card-white);">Your Outfit Checklist</div>
                
                <div style="display: flex; gap: 20px; align-items: center; justify-content: center; flex: 1;">
                    <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f466-1f3fd.svg" style="width: 130px; height: 130px; filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.15));">
                    
                    <div style="display: flex; flex-direction: column; width: 220px;">
                        <div class="clothes-item" onclick="this.style.opacity = '0.5'">
                            <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f9e5.svg"> <span>Hoodie</span>
                        </div>
                        <div class="clothes-item" onclick="this.style.opacity = '0.5'">
                            <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f456.svg"> <span>Jeans</span>
                        </div>
                        <div class="clothes-item" onclick="this.style.opacity = '0.5'">
                            <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f45f.svg"> <span>Sneakers</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav>
            <div class="tab tab-today"><img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f60e.svg"><span>TODAY</span></div>
            <div class="tab tab-calendar"><img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f4c5.svg"><span>CALENDAR</span></div>
            <div class="tab tab-quote"><img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f3c6.svg"><span>QUOTE</span></div>
            <!-- ACTIVE TAB -->
            <div class="tab tab-wardrobe active"><img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f9e5.svg"><span>WARDROBE</span></div>
            <div class="tab tab-fun"><img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f996.svg"><span>FUN</span></div>
        </nav>
    </div>
</body>
</html>
